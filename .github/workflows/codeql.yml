name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths-ignore:
              - node_modules
              - public/vendor
              - packages/yakyard-lock/dist
              - public/lock/yakyard-crypto.js
              - site/dist

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
