name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (JavaScript and secrets rules, must pass)
        run: >
          semgrep scan --config p/javascript --config p/secrets --error --metrics=off
          --exclude node_modules --exclude public/vendor --exclude packages/yakyard-lock/dist
          --exclude public/lock/yakyard-crypto.js --exclude site/dist

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
      YY_BASE: http://localhost:8811
      YY_PERSIST: /tmp/yy-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Syntax check
        run: |
          for f in src/*.js public/*.js public/lock/*.js packages/yakyard-lock/src/*.js scripts/*.mjs test/*.mjs packages/yakyard-lock/test/*.mjs; do node --check "$f"; done

      - name: Unit tests
        run: node --test test/*.test.mjs packages/yakyard-lock/test/*.test.mjs

      - name: Locking code matches its package and published hashes
        run: node scripts/lock-sync.mjs --check

      - name: Website builds
        run: npm run site:build

      - name: Start a local Yakyard
        run: |
          # Test-only setup code; the security suite uses the same value.
          echo "SETUP_TOKEN=testsetuptoken123456789012" > .dev.vars
          node scripts/migrate.mjs --local --persist-to=$YY_PERSIST
          nohup npx wrangler dev --local --persist-to $YY_PERSIST --port 8811 > wrangler-dev.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -s -o /dev/null http://localhost:8811/; then echo "up after ${i}s"; exit 0; fi
            sleep 1
          done
          cat wrangler-dev.log
          exit 1

      - name: Security suite
        run: python test/security.py

      - name: Server log
        if: failure()
        run: tail -n 200 wrangler-dev.log

  # The Docker image (docs/DOCKER.md): build it, start it, run the same security suite against the container,
  # then restart it and check nothing was lost.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: "false"
      YY_BASE: http://localhost:8811
      YY_PERSIST: /tmp/yy-docker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install (the suite reads the database with wrangler)
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Build the image
        run: docker build -t yakyard:ci .

      - name: Start the container
        run: |
          # The data folder is shared with the runner, so the container runs as the runner's user.
          mkdir -p $YY_PERSIST
          docker run -d --name yy --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e SETUP_TOKEN=testsetuptoken123456789012 -v $YY_PERSIST:/data -p 8811:8787 yakyard:ci
          for i in $(seq 1 90); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' yy)" = healthy ]; then echo "healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          docker logs yy
          exit 1

      - name: Security suite
        run: python test/security.py

      - name: Data survives a restart
        run: |
          count() { npx wrangler d1 execute DB --local --persist-to=$YY_PERSIST --json --command "SELECT COUNT(*) n FROM messages" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s)[0].results[0].n))"; }
          before=$(count)
          docker restart yy
          for i in $(seq 1 90); do [ "$(docker inspect -f '{{.State.Health.Status}}' yy)" = healthy ] && break; sleep 1; done
          after=$(count)
          echo "messages before: $before, after: $after"
          [ "$before" -gt 0 ] && [ "$before" = "$after" ]
          curl -sf -o /dev/null http://localhost:8811/setup

      - name: Container log
        if: failure()
        run: docker logs yy 2>&1 | tail -n 200
