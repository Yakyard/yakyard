name: Site deploy

# Publishes yakyard.pages.dev when the website or its docs change on main.
# Only runs in the official repo. Copies made with the Deploy button skip it.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'Yakyard/yakyard'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the site
        run: npm run site:build
        env:
          SITE_URL: https://yakyard.pages.dev

      - name: Publish to Cloudflare Pages
        working-directory: site/dist
        run: npx wrangler pages deploy . --project-name yakyard --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SITE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 814936d69fb25f724b5817f34136c386

      - name: Check it is live
        run: curl -sf -o /dev/null https://yakyard.pages.dev/
