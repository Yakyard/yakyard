[package]
name = "yakyard-crypto"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Small wasm-bindgen wrapper around vodozemac (Olm + Megolm) for Yakyard locked conversations."

[lib]
crate-type = ["cdylib"]

[dependencies]
vodozemac = { version = "=0.11.2", default-features = false, features = ["wasm_js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "=0.2.100"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
