# Yakyard on your own server. Step by step: docs/DOCKER.md.
#   cp .env.example .env   (then fill in DOMAIN and SETUP_TOKEN)
#   docker compose up -d
services:
  yakyard:
    image: ghcr.io/yakyard/yakyard:${YAKYARD_VERSION:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_URL: ${APP_URL:-https://${DOMAIN}}
    volumes:
      - yakyard-data:/data
    stop_grace_period: 30s

  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    depends_on:
      - yakyard
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  yakyard-data:
  caddy-data:
  caddy-config:
