<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#eef0f3"><meta name="yakyard-version" content="dev">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Yakyard">
<link rel="apple-touch-icon" href="/brand/app-icon-180.png">
<title>Yakyard</title>
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" href="/brand/favicon-64.png" type="image/png" sizes="64x64">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<link rel="stylesheet" href="/app.css?v=dev">
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" id="btn-back" title="Back" aria-label="Back"><svg viewBox="0 0 20 20"><path d="M11.7 4.3a1 1 0 0 1 0 1.4L7.4 10l4.3 4.3a1 1 0 0 1-1.4 1.4l-5-5a1 1 0 0 1 0-1.4l5-5a1 1 0 0 1 1.4 0z"/></svg></button>
    </div>
    <button class="search-bar" id="btn-search"><svg viewBox="0 0 20 20"><path d="M8.5 3a5.5 5.5 0 0 1 4.4 8.8l3.4 3.5a.8.8 0 1 1-1.1 1.1l-3.5-3.4A5.5 5.5 0 1 1 8.5 3zm0 1.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg><span id="search-label">Search</span></button>
    <div class="topbar-right"><div class="clocks" id="clocks"></div>
      <button class="icon-btn" id="btn-help" title="Keyboard shortcuts" aria-label="Help"><svg viewBox="0 0 20 20"><path d="M10 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16zm0 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zm0 9.3a1 1 0 1 1 0 2 1 1 0 0 1 0-2zM10 5c1.7 0 3 1.1 3 2.6 0 1.3-.8 1.9-1.6 2.4-.5.3-.7.5-.7 1v.3H9.2V11c0-1.2.7-1.8 1.4-2.2.6-.4.9-.6.9-1.2 0-.6-.6-1.1-1.5-1.1s-1.5.5-1.6 1.3H6.9C7 6.1 8.3 5 10 5z"/></svg></button>
    </div>
  </header>

  <nav class="rail" aria-label="Workspace">
    <button class="ws-icon" id="ws-icon" title="Yakyard"><img src="/brand/logo.png" alt="Yakyard"></button>
    <button class="rail-btn active" data-view="home"><span class="rail-ico"><svg viewBox="0 0 20 20"><path d="M10.6 2.4a1 1 0 0 0-1.2 0l-6 4.7A1 1 0 0 0 3 8v8a2 2 0 0 0 2 2h3a1 1 0 0 0 1-1v-4h2v4a1 1 0 0 0 1 1h3a2 2 0 0 0 2-2V8a1 1 0 0 0-.4-.9l-6-4.7z"/></svg></span><span>Home</span></button>
    <button class="rail-btn" data-view="dms"><span class="rail-ico"><svg viewBox="0 0 20 20"><path d="M4 4h12a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H9l-4 3v-3H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 1.5a.5.5 0 0 0-.5.5v7c0 .3.2.5.5.5h2.5v1.7l2.1-1.7H16c.3 0 .5-.2.5-.5V6a.5.5 0 0 0-.5-.5H4z"/></svg></span><span>DMs</span></button>
    <button class="rail-btn" data-view="activity"><span class="rail-ico"><svg viewBox="0 0 20 20"><path d="M10 2a5 5 0 0 1 5 5v3.4l1.6 2.7A1 1 0 0 1 15.8 15H4.2a1 1 0 0 1-.9-1.5L5 10.4V7a5 5 0 0 1 5-5zm2 14a2 2 0 0 1-4 0h4z"/></svg><i class="rail-badge" id="activity-badge" hidden></i></span><span>Activity</span></button>
    <div class="rail-spacer"></div>
    <button class="rail-avatar" id="me-avatar" title="You"></button>
  </nav>

  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <button class="ws-name" id="ws-menu"><span id="ws-name"></span><svg viewBox="0 0 20 20"><path d="M5.7 7.3a1 1 0 0 1 1.4 0L10 10.2l2.9-2.9a1 1 0 1 1 1.4 1.4l-3.6 3.6a1 1 0 0 1-1.4 0L5.7 8.7a1 1 0 0 1 0-1.4z"/></svg></button>
      <button class="icon-btn" id="btn-compose" title="New message" aria-label="New message"><svg viewBox="0 0 20 20"><path d="M14.3 2.3a1 1 0 0 1 1.4 0l2 2a1 1 0 0 1 0 1.4l-8 8a1 1 0 0 1-.5.3l-3 .7a.6.6 0 0 1-.7-.7l.7-3a1 1 0 0 1 .3-.5l7.8-8.2zM3 5h5v1.5H3.5v10h10V12H15v5a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg></button>
    </div>
    <button class="find" id="btn-find"><svg viewBox="0 0 20 20"><path d="M8.5 3a5.5 5.5 0 0 1 4.4 8.8l3.4 3.5a.8.8 0 1 1-1.1 1.1l-3.5-3.4A5.5 5.5 0 1 1 8.5 3zm0 1.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg>Find a conversation…</button>
    <div class="side-scroll" id="side-list"></div>
  </aside>

  <main class="main" id="main">
    <div class="empty-main" id="empty-main"><div class="empty-mark"><img src="/brand/logo.png" alt=""></div><p>Pick a channel to start.</p></div>
  </main>

  <aside class="thread" id="thread" hidden></aside>
</div>

<nav class="tabbar" id="tabbar" aria-label="Sections">
  <button data-tab="home" class="on"><svg viewBox="0 0 20 20"><path d="M10.6 2.4a1 1 0 0 0-1.2 0l-6 4.7A1 1 0 0 0 3 8v8a2 2 0 0 0 2 2h3a1 1 0 0 0 1-1v-4h2v4a1 1 0 0 0 1 1h3a2 2 0 0 0 2-2V8a1 1 0 0 0-.4-.9l-6-4.7z"/></svg><span>Home</span></button>
  <button data-tab="dms"><svg viewBox="0 0 20 20"><path d="M4 4h12a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H9l-4 3v-3H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg><span>DMs</span></button>
  <button data-tab="activity"><svg viewBox="0 0 20 20"><path d="M10 2a5 5 0 0 1 5 5v3.4l1.6 2.7A1 1 0 0 1 15.8 15H4.2a1 1 0 0 1-.9-1.5L5 10.4V7a5 5 0 0 1 5-5zm2 14a2 2 0 0 1-4 0h4z"/></svg><span>Activity</span><i class="tab-badge" id="tab-badge" hidden></i></button>
  <button data-tab="team"><svg viewBox="0 0 20 20"><path d="M10 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16zm0 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM9.3 5.5h1.4v4.2l3 1.8-.7 1.2-3.7-2.2v-5z"/></svg><span>Team</span></button>
  <button data-tab="you"><span class="tab-me" id="tab-me"></span><span>You</span></button>
</nav>
<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="/app.js?v=dev" type="module"></script>
</body>
</html>
